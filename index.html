<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Телефон</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#000000;
    --surface:#1c1c1f;
    --surface2:#232327;
    --text:#f2f2f3;
    --text-dim:#9e9ea4;
    --accent:#2a7cff;
    --green:#3ddc84;
    --red:#ea4335;
    --divider:#2a2a2e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  input,textarea{user-select:text;-webkit-user-select:text;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;justify-content:center;
    overscroll-behavior:none;
  }
  #app{
    width:100%;max-width:480px;height:100dvh;height:100vh;
    display:flex;flex-direction:column;
    position:relative;
  }

  /* ===== Header ===== */
  header{
    flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 4px;
    display:flex;align-items:center;gap:12px;
  }
  #search-pill{
    flex:1;display:flex;align-items:center;gap:10px;
    height:46px;background:rgba(255,255,255,0.07);
    border-radius:24px;padding:0 16px;
  }
  #search-pill svg{flex:0 0 auto;opacity:.55;}
  #search-hint{color:var(--text-dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #search-input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--text);font-size:15px;display:none;
  }
  #search-pill.searchable{cursor:pointer;}
  #avatar{
    flex:0 0 auto;width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:500;color:#fff;
    background:linear-gradient(135deg,#7e57c2,#4285f4);
    cursor:pointer;position:relative;
  }

  /* ===== Tabs ===== */
  nav#tabs{flex:0 0 auto;display:flex;padding:4px 0 0;}
  .tab{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-size:15px;font-weight:500;padding:12px 0 10px;position:relative;cursor:pointer;
  }
  .tab.active{color:var(--text);}
  .tab.active::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:4px;width:26px;height:3px;border-radius:2px;background:var(--accent);
  }
  .tab.pulse::after{background:var(--accent);}

  /* ===== Panels ===== */
  main{flex:1;min-height:0;display:flex;flex-direction:column;}
  .panel{flex:1;min-height:0;display:none;flex-direction:column;animation:fade .18s ease;}
  .panel.active{display:flex;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .list{flex:1;overflow-y:auto;padding:4px 0 24px;}
  .li{
    display:flex;align-items:center;gap:14px;padding:11px 16px;cursor:pointer;
    border-bottom:1px solid var(--divider);
  }
  .li:active{background:rgba(255,255,255,.06);}
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:16px;font-weight:500;
  }
  .li-main{flex:1;min-width:0;}
  .li-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li-sub{font-size:13px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li-right{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  .call-ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .empty-pad{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;}

  /* ===== Dialpad ===== */
  #dialpad-panel{overflow:hidden;}
  #number-area{
    flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding:8px 28px 10px;min-height:0;
  }
  #number-label{font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  #number-display{
    font-size:clamp(26px,7vw,34px);letter-spacing:.5px;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:42px;text-align:center;
  }
  #dialpad-actions{
    flex:0 0 auto;display:flex;justify-content:center;gap:64px;align-items:center;padding-bottom:8px;
  }
  .icon-btn{
    width:52px;height:52px;border-radius:50%;border:none;background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--text);
  }
  .icon-btn svg{opacity:.85;}
  .icon-btn:active{background:rgba(255,255,255,.1);}
  #keypad{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);
    row-gap:6px;padding:0 20px 2px;
  }
  .key{
    justify-self:center;width:min(19vw,72px);height:min(19vw,72px);border-radius:50%;
    border:none;background:transparent;color:var(--text);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    transition:background .12s;
  }
  .key:active{background:rgba(255,255,255,.14);}
  .k-num{font-size:clamp(24px,6.5vw,28px);font-weight:400;line-height:1;}
  .k-letters{font-size:9px;letter-spacing:1px;color:var(--text-dim);line-height:1;}
  #call-row{flex:0 0 auto;display:flex;justify-content:center;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));}
  #btn-call{
    width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
    background:var(--green);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(61,220,132,.28);
  }
  #btn-call svg{width:30px;height:30px;fill:#04361d;}
  #btn-call:active{transform:scale(.94);}
  #btn-call.ring{box-shadow:0 0 0 12px rgba(61,220,132,.18);}

  /* ===== Overlay bases ===== */
  .overlay{
    position:absolute;inset:0;z-index:50;display:none;
    background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:24px;
  }
  .overlay.show{display:flex;animation:fade .15s ease;}
  .mat-dialog{
    width:100%;max-width:320px;background:var(--surface);
    border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);
    border:1px solid var(--divider);animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .mat-dialog h3{
    font-size:17px;font-weight:500;padding:18px 20px 6px;text-align:center;
  }
  .mat-dialog .body{padding:6px 20px 14px;font-size:15px;color:var(--text);line-height:1.5;text-align:center;white-space:pre-line;word-break:break-word;}
  .dialog-btns{display:flex;justify-content:center;padding:4px 8px 10px;gap:8px;}
  .dbtn{
    min-width:88px;padding:10px 16px;border:none;border-radius:20px;cursor:pointer;
    font-size:15px;font-weight:500;background:#38383d;color:#c9c9cf;
  }
  .dbtn.primary{background:rgba(42,124,255,.22);color:#8ab4f8;}
  .dbtn.danger{background:rgba(234,67,53,.2);color:#f28b82;}
  .dbtn:active{filter:brightness(1.3);}
  .progress{height:3px;background:rgba(255,255,255,.08);position:relative;}
  .progress .ind{
    position:absolute;top:0;left:0;height:100%;width:40%;background:var(--accent);
    animation:slide 1.1s infinite ease-in-out;
  }
  @keyframes slide{0%{left:-40%;}100%{left:100%;}}

  /* ===== Call screen ===== */
  #call-screen{background:#000;}
  #call-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;position:relative;}
  #call-avatar{
    width:118px;height:118px;border-radius:50%;margin-top:calc(env(safe-area-inset-top,0px) + 14vh);
    display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:500;color:#fff;
    background:linear-gradient(135deg,#7e57c2,#4285f4);
    box-shadow:0 0 0 8px rgba(255,255,255,.05);
  }
  #call-status{margin-top:26px;font-size:18px;color:var(--text);min-height:26px;}
  #call-number{margin-top:8px;font-size:26px;letter-spacing:.3px;text-align:center;padding:0 24px;}
  #call-btns{
    margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:26px;
    padding-bottom:calc(34px + env(safe-area-inset-bottom,0px));
  }
  .cbtn-row{display:flex;gap:30px;}
  .cbtn{
    width:62px;height:62px;border-radius:50%;border:none;background:rgba(255,255,255,.1);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    position:relative;
  }
  .cbtn span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .cbtn.on{background:rgba(42,124,255,.85);}
  .cbtn:active{filter:brightness(1.25);}
  #cb-hangup{
    width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
    background:var(--red);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(234,67,53,.3);
  }
  #cb-hangup svg{width:30px;height:30px;fill:#fff;}
  #cb-hangup:active{transform:scale(.94);}

  /* ===== Settings ===== */
  #settings-screen{
    position:absolute;inset:0;z-index:60;background:var(--bg);
    display:none;flex-direction:column;animation:fade .18s ease;
  }
  #settings-screen.show{display:flex;}
  .set-top{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 6px;
  }
  .set-top h1{font-size:19px;font-weight:500;flex:1;text-align:center;}
  .back-btn{
    width:42px;height:42px;border-radius:50%;border:none;background:none;color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .back-btn:active{background:rgba(255,255,255,.1);}
  .set-list{flex:1;overflow-y:auto;padding:8px 16px 90px;}
  .set-group-title{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 6px;}
  .set-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 4px;border-bottom:1px solid var(--divider);
  }
  .set-row label{font-size:15px;flex:0 0 auto;}
  .set-row input, .set-row textarea{
    font-size:15px;color:var(--text);background:var(--surface2);
    border:1px solid var(--divider);border-radius:8px;padding:8px 10px;outline:none;
  }
  .set-row input{max-width:150px;text-align:right;font-family:inherit;}
  .set-row textarea{resize:none;}
  .switch{
    width:52px;height:30px;border-radius:16px;background:#4a4a50;position:relative;cursor:pointer;flex:0 0 auto;
    transition:background .2s;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
    transition:transform .2s;
  }
  .switch.on{background:var(--green);}
  .switch.on::after{transform:translateX(22px);}
  .set-actions{padding:10px 4px 0;display:flex;gap:12px;}
  .set-btn{
    flex:1;padding:13px;border:none;border-radius:23px;cursor:pointer;font-size:15px;font-weight:500;
    background:rgba(42,124,255,.2);color:#8ab4f8;
  }
  .set-btn.ghost{background:rgba(255,255,255,.08);color:#c9c9cf;}
  .set-btn:active{filter:brightness(1.3);}
  .set-hint{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.5;}

  /* ===== PIN dialog ===== */
  #pin-input{
    width:100%;padding:12px;font-size:22px;letter-spacing:6px;text-align:center;
    background:var(--surface2);border:1px solid var(--divider);border-radius:10px;color:var(--text);outline:none;
  }

  /* ===== Toast ===== */
  #toast{
    position:absolute;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:#3c4043;color:#fff;font-size:14px;padding:10px 18px;border-radius:22px;
    z-index:90;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;white-space:nowrap;max-width:90%;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .shake{animation:shake .4s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div id="search-pill" class="searchable">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#9e9ea4"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <span id="search-hint">Поиск людей и номеров</span>
      <input id="search-input" type="search" placeholder="Поиск людей и номеров" autocomplete="off">
    </div>
    <div id="avatar">Т</div>
  </header>

  <nav id="tabs">
    <button class="tab" data-tab="recents">Недавние</button>
    <button class="tab" data-tab="contacts">Контакты</button>
    <button class="tab active" data-tab="dialpad">Клавиатура</button>
  </nav>

  <main>
    <section id="recents-panel" class="panel">
      <div class="list" id="recents-list"></div>
    </section>

    <section id="contacts-panel" class="panel">
      <div class="list" id="contacts-list"></div>
    </section>

    <section id="dialpad-panel" class="panel active">
      <div id="number-area">
        <div id="number-label">Наберите номер</div>
        <div id="number-display"></div>
      </div>
      <div id="dialpad-actions">
        <button id="btn-add" class="icon-btn" title="Добавить в контакты">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#9e9ea4"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
        <button id="btn-delete" class="icon-btn" title="Удалить">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#9e9ea4"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
        </button>
      </div>
      <div id="keypad">
        <button class="key" data-key="1"><span class="k-num">1</span></button>
        <button class="key" data-key="2"><span class="k-num">2</span><span class="k-letters">ABC</span></button>
        <button class="key" data-key="3"><span class="k-num">3</span><span class="k-letters">DEF</span></button>
        <button class="key" data-key="4"><span class="k-num">4</span><span class="k-letters">GHI</span></button>
        <button class="key" data-key="5"><span class="k-num">5</span><span class="k-letters">JKL</span></button>
        <button class="key" data-key="6"><span class="k-num">6</span><span class="k-letters">MNO</span></button>
        <button class="key" data-key="7"><span class="k-num">7</span><span class="k-letters">PQRS</span></button>
        <button class="key" data-key="8"><span class="k-num">8</span><span class="k-letters">TUV</span></button>
        <button class="key" data-key="9"><span class="k-num">9</span><span class="k-letters">WXYZ</span></button>
        <button class="key" data-key="*"><span class="k-num">*</span></button>
        <button class="key" data-key="0"><span class="k-num">0</span><span class="k-letters">+</span></button>
        <button class="key" data-key="#"><span class="k-num">#</span></button>
      </div>
      <div id="call-row">
        <button id="btn-call" title="Позвонить">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
      </div>
    </section>
  </main>

  <!-- USSD dialog -->
  <div id="ussd-overlay" class="overlay">
    <div class="mat-dialog">
      <h3 id="ussd-title">Запрос USSD</h3>
      <div class="body" id="ussd-body">Идёт обмен данными с сетью…</div>
      <div class="dialog-btns">
        <button class="dbtn" id="ussd-cancel">Отмена</button>
        <button class="dbtn primary" id="ussd-ok" style="display:none;">OK</button>
      </div>
      <div class="progress" id="ussd-progress"><div class="ind"></div></div>
    </div>
  </div>

  <!-- Call screen -->
  <div id="call-screen" class="overlay">
    <div id="call-inner">
      <div id="call-avatar">Т</div>
      <div id="call-status">Вызов…</div>
      <div id="call-number"></div>
      <div id="call-btns">
        <div class="cbtn-row">
          <button class="cbtn" id="cb-mute"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg><span>Откл. звук</span></button>
          <button class="cbtn" id="cb-keypad"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-2v2h2V8zm-4 0h-2v2h2V8zm-4 0H8v2h2V8zM6 8H4v2h2V8zm12 4h-2v2h2v-2zm-4 0h-2v2h2v-2zm-4 0H8v2h2v-2zm-4 0H4v2h2v-2zm12 4h-2v2h2v-2zm-4 0h-2v2h2v-2zm-4 0H8v2h2v-2zm-4 0H4v2h2v-2zM12 3C7.03 3 3 7.03 3 12s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9z"/></svg><span>Клавиатура</span></button>
          <button class="cbtn" id="cb-speaker"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><span>Динамик</span></button>
        </div>
        <div class="cbtn-row">
          <button class="cbtn" id="cb-hold"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>Удержание</span></button>
          <button class="cbtn" id="cb-more"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg><span>Ещё</span></button>
        </div>

/* ============ Клавиатура ============ */
function formatDisplay(s){
  if (!s) return '';

  var raw = s.replace(/[^\d+]/g, '');

/* ============ События ============ */

  els.keys.forEach(function(k){
    var suppress = false;
    if (k.dataset.key === '0'){
      var lp = null;
      function longPress0(){
        if (suppress) return;
        suppress = true;
        pressKey('+'); vibrate(30);
      }
      k.addEventListener('touchstart', function(){ lp = setTimeout(longPress0, 480); });
      k.addEventListener('touchend', function(){ if (lp){ clearTimeout(lp); lp = null; } });
      k.addEventListener('mousedown', function(){ lp = setTimeout(longPress0, 480); });
      k.addEventListener('mouseup', function(){ if (lp){ clearTimeout(lp); lp = null; } });
      k.addEventListener('mouseleave', function(){ if (lp){ clearTimeout(lp); lp = null; } });
    }
    k.addEventListener('click', function(){
      if (suppress){ suppress = false; return; }
      pressKey(k.dataset.key);
    });
  });

  var delSuppress = false;
  function delLong(){ delSuppress = true; clearAll(); }
  var delLp = null;
  els.btnDelete.addEventListener('click', function(){
    if (delSuppress){ delSuppress = false; return; }
    deleteChar();
  });
  els.btnDelete.addEventListener('touchstart', function(){ delLp = setTimeout(delLong, 480); });
  els.btnDelete.addEventListener('touchend', function(){ if (delLp){ clearTimeout(delLp); delLp = null; } });
  els.btnDelete.addEventListener('mousedown', function(){ delLp = setTimeout(delLong, 480); });
  els.btnDelete.addEventListener('mouseup', function(){ if (delLp){ clearTimeout(delLp); delLp = null; } });
  els.btnDelete.addEventListener('mouseleave', function(){ if (delLp){ clearTimeout(delLp); delLp = null; } });
  els.btnAdd.addEventListener('click', function(){
    if (!typed){ toast('Наберите номер'); return; }
    toast('Контакт «' + formatDisplay(typed) + '» добавлен');
    typed = ''; renderNumber();
  });

  els.btnCall.addEventListener('click', doCall);

  els.tabs.forEach(function(t){ t.addEventListener('click', function(){ switchTab(t.dataset.tab); }); });

  els.recentsList.addEventListener('click', function(e){
    var li = e.target.closest('.li'); if (li) fillDialpad(li.dataset.raw);
  });
  els.contactsList.addEventListener('click', function(e){
    var li = e.target.closest('.li'); if (li) fillDialpad(li.dataset.raw);
  });

  els.searchInput.addEventListener('input', function(){
    var q = els.searchInput.value;
    if (currentTab === 'recents') renderRecents(q);
    else renderContacts(q);
  });
  els.searchInput.addEventListener('keydown', function(e){ e.stopPropagation(); });

  /* долгое нажатие на поиск или аватар = вход в настройки */
  function bindLongPress(el, fn){
    var t = null;
    el.addEventListener('touchstart', function(){ t = setTimeout(fn, 600); });
    el.addEventListener('touchend', function(){ if (t){ clearTimeout(t); t = null; } });
    el.addEventListener('mousedown', function(){ t = setTimeout(fn, 600); });
    el.addEventListener('mouseup', function(){ if (t){ clearTimeout(t); t = null; } });
    el.addEventListener('mouseleave', function(){ if (t){ clearTimeout(t); t = null; } });
  }
  bindLongPress(els.searchPill, openPin);
  bindLongPress(els.avatar, openPin);

  /* USSD */
  els.ussdCancel.addEventListener('click', cancelUssd);
  els.ussdOk.addEventListener('click', finishUssd);

  /* Экран вызова */
  els.cbHangup.addEventListener('click', hangUp);
  els.cbMute.addEventListener('click', function(){ els.cbMute.classList.toggle('on'); vibrate(10); });
  els.cbKeypad.addEventListener('click', function(){ els.cbKeypad.classList.toggle('on'); vibrate(10); });
  els.cbSpeaker.addEventListener('click', function(){ els.cbSpeaker.classList.toggle('on'); vibrate(10); });
  els.cbHold.addEventListener('click', function(){ els.cbHold.classList.toggle('on'); vibrate(10); });
  els.cbMore.addEventListener('click', function(){ toast('Нет дополнительных функций'); });

  /* Настройки */
  els.setBack.addEventListener('click', closeSettings);
  els.setSave.addEventListener('click', saveSettingValues);
  els.setReset.addEventListener('click', resetSettings);
  els.setSound.addEventListener('click', function(){ els.setSound.classList.toggle('on'); });
  els.setVibrate.addEventListener('click', function(){ els.setVibrate.classList.toggle('on'); });

  /* PIN */
  els.pinCancel.addEventListener('click', closePin);
  els.pinOk.addEventListener('click', tryPin);
  els.pinInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryPin(); });

  /* Escape — закрывать оверлеи */
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (pinOpen) return closePin();
    if (settingsOpen) return closeSettings();
    if (callActive) return hangUp();
    if (ussdOpen) return cancelUssd();
  });
}

/* ============ Инициализация ============ */
function init(){
  loadSettings();
  renderNumber();
  renderRecents();
  renderContacts();
  switchTab('dialpad');
  bind();
  try {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  } catch(e){}
}
document.addEventListener('DOMContentLoaded', init);

/* Вернуться (используется хардверной кнопкой «назад», если обёртка вызывает) */
window.__handleBack = function(){
  if (pinOpen){ closePin(); return 'handled'; }
  if (settingsOpen){ closeSettings(); return 'handled'; }
  if (callActive){ hangUp(); return 'handled'; }
  if (ussdOpen){ cancelUssd(); return 'handled'; }
  if (currentTab !== 'dialpad'){ switchTab('dialpad'); return 'handled'; }
  if (typed){ typed = ''; renderNumber(); return 'handled'; }
  if (history.length > 1){ history.back(); return 'handled'; }
  return 'exit';
};
</script>
</body>
